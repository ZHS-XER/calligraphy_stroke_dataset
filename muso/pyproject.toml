[project]
name = "code-MUSO"
version = "0.1.0"
description = "Extract Chinese character stroke sequences from PDF to create a dataset"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pymupdf>=1.23.0",
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
